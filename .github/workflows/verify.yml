name: verify

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 2 * * 1" # weekly: new advisories appear without any code change

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # lint (gofmt, vet, golangci-lint), mocks-check, secrets (gitleaks), tests with -race, coverage ratchet
      - name: make verify
        run: make verify

      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: govulncheck
        run: make vuln
