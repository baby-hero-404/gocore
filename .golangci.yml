version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - errorlint
    - noctx
    - contextcheck
    - gosec
    - revive
    - forbidigo
  settings:
    forbidigo:
      forbid:
        - pattern: ^time\.Sleep$
          msg: "use a context-aware wait (select on ctx.Done()); time.Sleep ignores cancellation (CS-5)"
        - pattern: ^(log\.Fatal.*|os\.Exit)$
          msg: "libraries must not terminate the process; return an error (CS-6)"
        - pattern: ^panic$
          msg: "return an error instead of panicking (CS-3)"
    revive:
      rules:
        - name: exported
          arguments: [disableStutteringCheck]
        - name: error-return
        - name: error-naming
        - name: context-as-argument
        - name: context-keys-type
  exclusions:
    generated: lax
    paths:
      - vendor
      - \.tokensave
    rules:
      # Tests may sleep, use fixtures that look like secrets, and skip error checks on cleanup.
      - path: _test\.go
        linters: [forbidigo, gosec, errcheck, noctx, revive]
      # Internal CLI tools are package main and may exit.
      - path: internal/tools/
        linters: [forbidigo]
      # Generated mocks are not hand-written.
      - path: mock_.*\.go
        linters: [revive, forbidigo, errcheck, unused]

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - vendor
